services:
  - type: web
    name: jpg-law-website
    env: static
    staticPublishPath: .
    buildCommand: ""
    routes:
      - type: rewrite
        source: /about
        destination: /about/
      - type: rewrite
        source: /about/jason
        destination: /about/jason/
      - type: rewrite
        source: /practice-areas
        destination: /practice-areas/
      - type: rewrite
        source: /practice-areas/staffing
        destination: /practice-areas/staffing/
      - type: rewrite
        source: /practice-areas/employment
        destination: /practice-areas/employment/
      - type: rewrite
        source: /practice-areas/technology
        destination: /practice-areas/technology/
      - type: rewrite
        source: /practice-areas/privacy
        destination: /practice-areas/privacy/
      - type: rewrite
        source: /practice-areas/commercial-contracts
        destination: /practice-areas/commercial-contracts/
      - type: rewrite
        source: /practice-areas/cross-border
        destination: /practice-areas/cross-border/
      - type: rewrite
        source: /practice-areas/corporate-compliance
        destination: /practice-areas/corporate-compliance/
      - type: rewrite
        source: /practice-areas/disputes
        destination: /practice-areas/disputes/
      - type: rewrite
        source: /practice-areas/startup
        destination: /practice-areas/startup/
      - type: rewrite
        source: /practice-areas/immigration
        destination: /practice-areas/immigration/
      - type: rewrite
        source: /practice-areas/general-business
        destination: /practice-areas/general-business/
      - type: rewrite
        source: /testimonials
        destination: /testimonials/
      - type: rewrite
        source: /contact
        destination: /contact/
      - type: rewrite
        source: /gc-subscription
        destination: /gc-subscription/
      - type: rewrite
        source: /practice-areas/legal-tech
        destination: /practice-areas/legal-tech/

  # ── Attorney review checkout service ──────────────────────
  - type: web
    name: jpg-law-checkout
    env: python
    rootDir: checkout
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 30 app:app
    healthCheckPath: /health
    envVars:
      - key: JPG_STRIPE_SECRET_KEY
        sync: false
      - key: JPG_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: JPG_STRIPE_TEST_BYPASS
        value: "false"
      - key: PACTA_CHECKOUT_SECRET
        sync: false
      - key: PACTA_CALLBACK_SECRET
        sync: false
      - key: PACTA_BASE_URL
        value: https://compliance.pactalegal.ai
      - key: BASE_URL
        value: https://checkout.jpg-law.net
      - key: SECRET_KEY
        generateValue: true
